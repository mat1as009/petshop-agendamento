<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Petshop</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>Petshop</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="clientes.html" class="ativo">Clientes</a>
      <span class="desativado">Pets</span>
      <span class="desativado">Agendamentos</span>
    </nav>
  </header>
  <main>
    <div class="topo">
      <h2>Clientes</h2>
      <a class="botao" href="cliente-form.html">Novo cliente</a>
    </div>
    <p id="mensagem" role="status"></p>
    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>Cidade</th><th>Ações</th></tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </main>

  <script>
    const lista = document.getElementById('lista');
    const mensagem = document.getElementById('mensagem');

    function celula(texto) {
      const td = document.createElement('td');
      td.textContent = texto;
      return td;
    }

    function linha(cliente) {
      const tr = document.createElement('tr');
      tr.append(celula(cliente.id), celula(cliente.nome), celula(cliente.cpf),
                celula(cliente.telefone), celula(cliente.endereco.cidade));

      const editar = document.createElement('a');
      editar.className = 'botao';
      editar.textContent = 'Editar';
      editar.href = 'cliente-form.html?id=' + cliente.id;

      const excluirBotao = document.createElement('button');
      excluirBotao.textContent = 'Excluir';
      excluirBotao.addEventListener('click', () => excluir(cliente));

      const acoes = document.createElement('td');
      acoes.append(editar, ' ', excluirBotao);
      tr.append(acoes);
      return tr;
    }

    async function carregar() {
      mensagem.textContent = '';
      const resposta = await fetch('/api/clientes');
      if (!resposta.ok) {
        mensagem.textContent = 'Não foi possível carregar os clientes.';
        return;
      }
      const clientes = await resposta.json();
      lista.replaceChildren(...clientes.map(linha));
      if (clientes.length === 0) {
        mensagem.textContent = 'Nenhum cliente cadastrado.';
      }
    }

    async function excluir(cliente) {
      if (!confirm('Excluir ' + cliente.nome + '?')) {
        return;
      }
      const resposta = await fetch('/api/clientes/' + cliente.id, { method: 'DELETE' });
      if (resposta.status === 204) {
        await carregar();
        return;
      }
      const corpo = await resposta.json();
      mensagem.textContent = corpo.erro;
    }

    carregar().catch(() => {
      mensagem.textContent = 'A API não respondeu. Ela está rodando?';
    });
  </script>
</body>
</html>
